# Variante para Azure Container Apps. Cada target es el FQDN interno HTTPS de la app
# (https://<app>.internal.<dominio>), que apunta al proxy Envoy del entorno: este balancea entre
# réplicas, así que cada scrape lee UNA réplica al azar. Para métricas por réplica en Azure se usa
# Azure Monitor (métricas de plataforma) o AKS con Managed Prometheus
# (ver microservices/docs/cloud/04-series-temporales-y-metricas.md).
#
# ${INTERNAL_SUFFIX} ("internal.<dominio-del-entorno>") lo sustituye entrypoint.sh al arrancar;
# el dominio solo se conoce al desplegar. HTTPS porque el entorno no admite allowInsecure.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    system: teamforme
    cloud: azure-container-apps

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: ms-events
    scheme: https
    static_configs: [{ targets: ["ms-events.${INTERNAL_SUFFIX}:443"] }]
  - job_name: ms-teams
    scheme: https
    static_configs: [{ targets: ["ms-teams.${INTERNAL_SUFFIX}:443"] }]
  - job_name: ms-applications
    scheme: https
    static_configs: [{ targets: ["ms-applications.${INTERNAL_SUFFIX}:443"] }]
  - job_name: ms-users
    scheme: https
    static_configs: [{ targets: ["ms-users.${INTERNAL_SUFFIX}:443"] }]
  - job_name: ms-notifications
    scheme: https
    static_configs: [{ targets: ["ms-notifications.${INTERNAL_SUFFIX}:443"] }]
