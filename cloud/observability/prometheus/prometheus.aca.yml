# Variante para Azure Container Apps. Los nombres internos (http://ms-events) apuntan al
# proxy Envoy del entorno, que balancea entre réplicas: cada scrape lee UNA réplica al azar.
# Para métricas por réplica en Azure se usa Azure Monitor (métricas de plataforma) o AKS
# con Managed Prometheus (ver microservices/docs/cloud/04-series-temporales-y-metricas.md).
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    system: teamforme
    cloud: azure-container-apps

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: ms-events
    static_configs: [{ targets: ["ms-events:80"] }]
  - job_name: ms-teams
    static_configs: [{ targets: ["ms-teams:80"] }]
  - job_name: ms-applications
    static_configs: [{ targets: ["ms-applications:80"] }]
  - job_name: ms-users
    static_configs: [{ targets: ["ms-users:80"] }]
  - job_name: ms-notifications
    static_configs: [{ targets: ["ms-notifications:80"] }]
