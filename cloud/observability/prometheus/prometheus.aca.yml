# Variante para Azure Container Apps. Cada target es la URL pública HTTPS de la app
# (https://<app>.<dominio>): el entorno express no tiene descubrimiento de servicios interno.
# Esa URL apunta al proxy del entorno, que balancea entre réplicas, así que cada scrape lee UNA
# réplica al azar. Para métricas por réplica se usa Azure Monitor (métricas de plataforma) o AKS
# con Managed Prometheus (ver microservices/docs/cloud/04-series-temporales-y-metricas.md).
#
# ${APPS_DOMAIN} (dominio por defecto del entorno) lo sustituye entrypoint.sh al arrancar;
# el dominio solo se conoce al desplegar.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    system: teamforme
    cloud: azure-container-apps

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: ms-events
    scheme: https
    static_configs: [{ targets: ["ms-events.${APPS_DOMAIN}:443"] }]
  - job_name: ms-teams
    scheme: https
    static_configs: [{ targets: ["ms-teams.${APPS_DOMAIN}:443"] }]
  - job_name: ms-applications
    scheme: https
    static_configs: [{ targets: ["ms-applications.${APPS_DOMAIN}:443"] }]
  - job_name: ms-users
    scheme: https
    static_configs: [{ targets: ["ms-users.${APPS_DOMAIN}:443"] }]
  - job_name: ms-notifications
    scheme: https
    static_configs: [{ targets: ["ms-notifications.${APPS_DOMAIN}:443"] }]
