# Overlay AKS (Azure Kubernetes Service).
# Antes de aplicar, reemplaza los marcadores __ACR_NAME__, __KEYVAULT_URI__ y
# __IDENTITY_CLIENT_ID__ (el script scripts/azure/deploy-aks.ps1 lo hace por ti).
#   kubectl apply -k k8s/ms-events/overlays/aks
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: teamforme/ms-events
    newName: __ACR_NAME__.azurecr.io/teamforme/ms-events
    newTag: latest
patches:
  # Workload Identity: el pod obtiene un token de Entra ID para la identidad administrada,
  # y con él lee Key Vault. Sin contraseñas en el clúster.
  - target: { kind: ServiceAccount, name: ms-events }
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          azure.workload.identity/client-id: __IDENTITY_CLIENT_ID__
  - target: { kind: Deployment, name: ms-events }
    patch: |-
      - op: add
        path: /spec/template/metadata/labels/azure.workload.identity~1use
        value: "true"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: AZURE_CLIENT_ID, value: __IDENTITY_CLIENT_ID__ }
  - target: { kind: ConfigMap, name: ms-events-config }
    patch: |-
      - op: replace
        path: /data/KeyVault__Uri
        value: __KEYVAULT_URI__
  # Exponer el servicio con una IP pública (Azure Load Balancer).
  - target: { kind: Service, name: ms-events }
    patch: |-
      - op: replace
        path: /spec/type
        value: LoadBalancer
