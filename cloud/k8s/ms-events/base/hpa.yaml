# Escalado HORIZONTAL automático (elasticidad).
# Algoritmo: réplicasDeseadas = ceil(réplicasActuales * métricaActual / métricaObjetivo)
# Ej.: 2 réplicas al 120 % de CPU con objetivo 60 % -> ceil(2 * 120 / 60) = 4 réplicas.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ms-events
  namespace: teamforme
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ms-events
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
    - type: Resource
      resource:
        name: memory
        target: { type: Utilization, averageUtilization: 75 }
  behavior:
    # Subir rápido (duplicar cada 15 s si hace falta)...
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - { type: Percent, value: 100, periodSeconds: 15 }
        - { type: Pods, value: 4, periodSeconds: 15 }
      selectPolicy: Max
    # ...y bajar despacio (evita oscilaciones / "flapping").
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - { type: Pods, value: 1, periodSeconds: 60 }
